name: athena-distributed-dev

networks:
  athena-distributed:
    driver: bridge

volumes:
  athena-postgresql-data:
  athena-nats-data:
  athena-minio-data:
  athena-prometheus-data:
  athena-grafana-data:
  athena-tempo-data:
  athena-loki-data:

services:
  postgresql:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: athena_platform_admin
      POSTGRES_PASSWORD: ${ATHENA_DEV_POSTGRES_ADMIN_PASSWORD:?required}
      POSTGRES_DB: postgres
      ATHENA_POSTGRES_MAIN_PASSWORD: ${ATHENA_DEV_POSTGRES_MAIN_PASSWORD:?required}
      ATHENA_POSTGRES_AUTH_PASSWORD: ${ATHENA_DEV_POSTGRES_AUTH_PASSWORD:?required}
    command:
      - postgres
      - -c
      - max_connections=120
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=500
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - athena-postgresql-data:/var/lib/postgresql/data
      - ./postgresql/init-athena.sh:/docker-entrypoint-initdb.d/10-athena.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena_platform_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - athena-distributed

  nats:
    image: nats:2.10.27-alpine
    restart: unless-stopped
    command:
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
      - --user=athena
      - --pass=${ATHENA_DEV_NATS_PASSWORD:?required}
    ports:
      - "127.0.0.1:54222:4222"
      - "127.0.0.1:58222:8222"
    volumes:
      - athena-nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - athena-distributed

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: athena_local_admin
      MINIO_ROOT_PASSWORD: ${ATHENA_DEV_MINIO_ROOT_PASSWORD:?required}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - athena-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - athena-distributed

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:54317:4317"
      - "127.0.0.1:54318:4318"
      - "127.0.0.1:59464:9464"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - athena-distributed

  prometheus:
    image: prom/prometheus:v3.4.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yaml:/etc/prometheus/alert-rules.yaml:ro
      - ./observability/slo-recording-rules.yaml:/etc/prometheus/slo-recording-rules.yaml:ro
      - athena-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:59090:9090"
    networks:
      - athena-distributed

  tempo:
    image: grafana/tempo:2.8.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - athena-tempo-data:/var/tempo
    networks:
      - athena-distributed

  loki:
    image: grafana/loki:3.5.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - athena-loki-data:/loki
    networks:
      - athena-distributed

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: athena_admin
      GF_SECURITY_ADMIN_PASSWORD: ${ATHENA_GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/athena.yaml:ro
      - athena-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:53000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - athena-distributed
