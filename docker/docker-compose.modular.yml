name: anythingllm-modular

x-operations-url: &operations-url https://anything-llm-operations-plane:3015
x-runtime-env-file: &runtime-env-file ${ATHENA_RUNTIME_ENV_FILE:-.env}
x-runtime-env-volume: &runtime-env-volume ${ATHENA_RUNTIME_ENV_FILE:-./.env}:/app/server/.env
x-runtime-env-volume-ro: &runtime-env-volume-ro ${ATHENA_RUNTIME_ENV_FILE:-./.env}:/app/server/.env:ro

networks:
  anything-llm:
    driver: bridge

services:
  anything-llm-api:
    container_name: anythingllm-api
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: api-production-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    depends_on:
      anything-llm-collector:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - *runtime-env-volume
      - "${ATHENA_PASSWORD_PEPPER_HOST_FILE:?required}:/run/secrets/athena_password_pepper:ro"
      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
      - "../server/storage:/app/server/storage"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${ATHENA_API_BIND_ADDRESS:-0.0.0.0}:3001:3001"
    env_file:
      - *runtime-env-file
    environment:
      ATHENA_PASSWORD_PEPPER_FILE: /run/secrets/athena_password_pepper
      ATHENA_RUNTIME_ROLE: api
      ATHENA_API_ONLY: "true"
      ATHENA_COLLECTOR_INLINE: "false"
      ATHENA_BACKGROUND_INLINE: "false"
      ATHENA_OPERATIONS_PLANE_INLINE: "false"
      ATHENA_OPERATIONS_INTERNAL_URL: *operations-url
      ATHENA_AUTHENTICATION_INLINE: "false"
      ATHENA_KNOWLEDGE_INGEST_INLINE: "false"
      ATHENA_RAG_INLINE: "false"
      ATHENA_RAG_CUTOVER: "true"
      ATHENA_RAG_URL: https://anything-llm-rag:3028
      ATHENA_BROWSER_PLANE_URL: https://anything-llm-browser-plane:3030
      ATHENA_BROWSER_AGENT_ENABLED: "false"
      COLLECTOR_ENDPOINT: http://anything-llm-collector:8888
    networks:
      - anything-llm
    extra_hosts:
      - "host.docker.internal:host-gateway"

  anything-llm-web:
    container_name: anythingllm-web
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: web-production-build
    depends_on:
      - anything-llm-api
    ports:
      - "${ATHENA_WEB_BIND_ADDRESS:-0.0.0.0}:3000:3000"
    environment:
      ATHENA_WEB_PORT: 3000
      ATHENA_API_UPSTREAM: http://anything-llm-api:3001
      ATHENA_REALTIME_UPSTREAM: ${ATHENA_REALTIME_UPSTREAM:-http://anything-llm-api:3001}
      ATHENA_CHAT_UPSTREAM: ${ATHENA_CHAT_UPSTREAM:-http://anything-llm-api:3001}
      ATHENA_AGENT_UPSTREAM: ${ATHENA_AGENT_UPSTREAM:-http://anything-llm-api:3001}
      ATHENA_TOOL_UPSTREAM: ${ATHENA_TOOL_UPSTREAM:-http://anything-llm-api:3001}
      ATHENA_CRYPTO_ACCOUNT_UPSTREAM: ${ATHENA_CRYPTO_ACCOUNT_UPSTREAM:-http://anything-llm-api:3001}
      ATHENA_CRYPTO_FORECAST_UPSTREAM: ${ATHENA_CRYPTO_FORECAST_UPSTREAM:-http://anything-llm-api:3001}
      ATHENA_IDENTITY_UPSTREAM: ${ATHENA_IDENTITY_UPSTREAM:-http://anything-llm-api:3001}
      ATHENA_KNOWLEDGE_INGEST_UPSTREAM: ${ATHENA_KNOWLEDGE_INGEST_UPSTREAM:-http://anything-llm-api:3001}
      ATHENA_BROWSER_STREAM_UPSTREAM: ${ATHENA_BROWSER_STREAM_UPSTREAM:-http://anything-llm-browser-worker:3031}
    networks:
      - anything-llm

  anything-llm-realtime-gateway:
    container_name: anythingllm-realtime-gateway
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: realtime-gateway-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    profiles:
      - realtime-gateway
    volumes:
      - *runtime-env-volume
      - "${ATHENA_PASSWORD_PEPPER_HOST_FILE:?required}:/run/secrets/athena_password_pepper:ro"
      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
      - "../server/storage:/app/server/storage"
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - *runtime-env-file
    environment:
      ATHENA_PASSWORD_PEPPER_FILE: /run/secrets/athena_password_pepper
      ATHENA_RUNTIME_ROLE: realtime-gateway
      ATHENA_OPERATIONS_INTERNAL_URL: *operations-url
      REALTIME_GATEWAY_PORT: 3013
      ATHENA_BROADCAST_TRANSPORT: ${ATHENA_BROADCAST_TRANSPORT:-memory}
    networks:
      - anything-llm

  anything-llm-reader-worker:
    container_name: anythingllm-reader-worker
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: reader-worker-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    profiles:
      - reader-worker
    volumes:
      - *runtime-env-volume
      - "${ATHENA_PASSWORD_PEPPER_HOST_FILE:?required}:/run/secrets/athena_password_pepper:ro"
      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
      - "../server/storage:/app/server/storage"
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - *runtime-env-file
    environment:
      ATHENA_PASSWORD_PEPPER_FILE: /run/secrets/athena_password_pepper
      ATHENA_RUNTIME_ROLE: reader-worker
      ATHENA_OPERATIONS_INTERNAL_URL: *operations-url
      READER_WORKER_PORT: 3011
    networks:
      - anything-llm

  anything-llm-background-worker:
    container_name: anythingllm-background-worker
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: background-worker-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    depends_on:
      - anything-llm-collector
    volumes:
      - *runtime-env-volume
      - "${ATHENA_PASSWORD_PEPPER_HOST_FILE:?required}:/run/secrets/athena_password_pepper:ro"
      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
      - "../server/storage:/app/server/storage"
      - "../collector/hotdir/:/app/collector/hotdir"
      - "../collector/outputs/:/app/collector/outputs"
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - *runtime-env-file
    environment:
      ATHENA_PASSWORD_PEPPER_FILE: /run/secrets/athena_password_pepper
      ATHENA_RUNTIME_ROLE: background-worker
      ATHENA_OPERATIONS_INTERNAL_URL: *operations-url
      ATHENA_BACKGROUND_INLINE: "false"
      COLLECTOR_ENDPOINT: http://anything-llm-collector:8888
      BACKGROUND_WORKER_PORT: 3012
    networks:
      - anything-llm

  anything-llm-scheduler:
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: scheduler-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    profiles:
      - scheduler
    volumes:
      - *runtime-env-volume
      - "${ATHENA_PASSWORD_PEPPER_HOST_FILE:?required}:/run/secrets/athena_password_pepper:ro"
      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
      - "../server/storage:/app/server/storage"
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - *runtime-env-file
    environment:
      ATHENA_PASSWORD_PEPPER_FILE: /run/secrets/athena_password_pepper
      ATHENA_RUNTIME_ROLE: scheduler
      ATHENA_OPERATIONS_INTERNAL_URL: *operations-url
      ATHENA_RESPONSES_RUNTIME_URL: https://anything-llm-responses-runtime:3034
      SCHEDULER_PORT: 3014
    networks:
      - anything-llm

  anything-llm-operations-plane:
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: operations-plane-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    profiles:
      - operations-plane
    volumes:
      - *runtime-env-volume
      - "${ATHENA_PASSWORD_PEPPER_HOST_FILE:?required}:/run/secrets/athena_password_pepper:ro"
      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
      - "../server/storage:/app/server/storage"
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - *runtime-env-file
    environment:
      ATHENA_PASSWORD_PEPPER_FILE: /run/secrets/athena_password_pepper
      ATHENA_RUNTIME_ROLE: operations-plane
      OPERATIONS_PLANE_PORT: 3015
      ATHENA_OPERATIONS_SHADOW_AGENTS_INLINE: "false"
      ATHENA_OPERATIONS_SHADOW_AGENTS_URL: https://anything-llm-operations-shadow-agents:3029
      ATHENA_MODULE_RUNTIME_ENDPOINTS: >-
        {"authentication":"https://anything-llm-identity:3026","chat-runtime":"https://anything-llm-chat-runtime:3016","agent-runtime":"https://anything-llm-agent-runtime:3017","model-gateway":"https://anything-llm-model-gateway:3018","responses-runtime":"https://anything-llm-responses-runtime:3034","tool-runtime":"https://anything-llm-tool-broker:3019","crypto-market":"https://anything-llm-crypto-market:3020","crypto-account-access":"https://anything-llm-crypto-account:3021","crypto-forecast":"https://anything-llm-crypto-forecast:3022","key-custody":"https://anything-llm-key-custody:3023","knowledge-ingest":"https://anything-llm-knowledge-ingest:3027","rag":"https://anything-llm-rag:3028","operations-shadow-agents":"https://anything-llm-operations-shadow-agents:3029","browser-plane":"https://anything-llm-browser-plane:3030","browser-worker":"https://anything-llm-browser-worker:3031","browser-egress":"https://anything-llm-browser-egress:3033","coordination-plane":"https://anything-llm-coordination-plane:3032","scheduler":"https://anything-llm-scheduler:3014"}
    networks:
      - anything-llm

  anything-llm-coordination-plane:
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: coordination-plane-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    profiles:
      - operations-plane
    volumes:
      - *runtime-env-volume-ro
      - "${ATHENA_PASSWORD_PEPPER_HOST_FILE:?required}:/run/secrets/athena_password_pepper:ro"
      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - *runtime-env-file
    environment:
      ATHENA_PASSWORD_PEPPER_FILE: /run/secrets/athena_password_pepper
      ATHENA_RUNTIME_ROLE: coordination-plane
      ATHENA_OPERATIONS_INTERNAL_URL: *operations-url
      COORDINATION_PLANE_PORT: 3032
    networks:
      - anything-llm

  anything-llm-chat-runtime:
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: chat-runtime-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    profiles:
      - core-runtimes
    volumes:
