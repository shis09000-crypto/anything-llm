      ATHENA_RUNTIME_ROLE: chat-runtime
      ATHENA_OPERATIONS_INTERNAL_URL: *operations-url
      ATHENA_AGENT_RUNTIME_URL: https://anything-llm-agent-runtime:3017
      CHAT_RUNTIME_PORT: 3016
      ATHENA_RESPONSES_RUNTIME_CUTOVER: ${ATHENA_RESPONSES_RUNTIME_CUTOVER:-false}
      ATHENA_RESPONSES_RUNTIME_URL: https://anything-llm-responses-runtime:3034
      ATHENA_RAG_CUTOVER: "true"
      ATHENA_RAG_URL: https://anything-llm-rag:3028
    networks:
      - anything-llm

  anything-llm-agent-runtime:
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: agent-runtime-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    profiles:
      - core-runtimes
    volumes:
      - *runtime-env-volume-ro
      - "${ATHENA_PASSWORD_PEPPER_HOST_FILE:?required}:/run/secrets/athena_password_pepper:ro"
      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - *runtime-env-file
    environment:
      ATHENA_PASSWORD_PEPPER_FILE: /run/secrets/athena_password_pepper
      ATHENA_RUNTIME_ROLE: agent-runtime
      ATHENA_OPERATIONS_INTERNAL_URL: *operations-url
      ATHENA_BROWSER_AGENT_ENABLED: "false"
      AGENT_RUNTIME_PORT: 3017
      ATHENA_RESPONSES_RUNTIME_CUTOVER: ${ATHENA_RESPONSES_RUNTIME_CUTOVER:-false}
      ATHENA_RESPONSES_RUNTIME_URL: https://anything-llm-responses-runtime:3034
      ATHENA_RAG_CUTOVER: "true"
      ATHENA_RAG_URL: https://anything-llm-rag:3028
    networks:
      - anything-llm

  anything-llm-model-gateway:
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: model-gateway-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    profiles:
      - core-runtimes
    volumes:
      - *runtime-env-volume-ro
      - "${ATHENA_PASSWORD_PEPPER_HOST_FILE:?required}:/run/secrets/athena_password_pepper:ro"
      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - *runtime-env-file
    environment:
      ATHENA_PASSWORD_PEPPER_FILE: /run/secrets/athena_password_pepper
      ATHENA_RUNTIME_ROLE: model-gateway
      ATHENA_OPERATIONS_INTERNAL_URL: *operations-url
      MODEL_GATEWAY_PORT: 3018
    networks:
