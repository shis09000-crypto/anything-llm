  anything-llm-responses-runtime:
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: responses-runtime-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    profiles:
      - core-runtimes
    depends_on:
      anything-llm-model-gateway:
        condition: service_healthy
      anything-llm-key-custody:
        condition: service_healthy
    volumes:
      - *runtime-env-volume-ro
      - "${ATHENA_PASSWORD_PEPPER_HOST_FILE:?required}:/run/secrets/athena_password_pepper:ro"
      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - *runtime-env-file
    environment:
      ATHENA_PASSWORD_PEPPER_FILE: /run/secrets/athena_password_pepper
      ATHENA_RUNTIME_ROLE: responses-runtime
      ATHENA_OPERATIONS_INTERNAL_URL: *operations-url
      ATHENA_MODEL_GATEWAY_URL: https://anything-llm-model-gateway:3018
      ATHENA_CHAT_RUNTIME_URL: https://anything-llm-chat-runtime:3016
      ATHENA_KEY_CUSTODY_CUTOVER: "true"
      ATHENA_KEY_CUSTODY_URL: https://anything-llm-key-custody:3023
      RESPONSES_RUNTIME_PORT: 3034
    networks:
      - anything-llm

  anything-llm-tool-broker:
