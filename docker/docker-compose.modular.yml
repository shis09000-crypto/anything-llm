      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
      - "${ATHENA_PLUGIN_CAPABILITY_HOST_DIR:?required}:/run/secrets/athena-capability:ro"
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
