  anything-llm-browser-worker:
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: browser-worker-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    profiles:
      - browser-runtimes
    depends_on:
      anything-llm-key-custody:
        condition: service_healthy
    init: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=./playwright-seccomp-profile.json
    shm_size: "256m"
    tmpfs:
      - /tmp/athena-browser-worker:rw,nosuid,nodev,noexec,size=512m,mode=0700,uid=1000,gid=1000
    volumes:
      - *runtime-env-volume-ro
      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - *runtime-env-file
    environment:
      ATHENA_RUNTIME_ROLE: browser-worker
      ATHENA_OPERATIONS_INTERNAL_URL: *operations-url
      ATHENA_KEY_CUSTODY_CUTOVER: "true"
      ATHENA_KEY_CUSTODY_URL: https://anything-llm-key-custody:3023
      BROWSER_WORKER_PORT: 3031
      BROWSER_WORKER_MAX_SESSIONS: 1
      BROWSER_WORKER_MAX_TABS: 8
      BROWSER_WORKER_IDLE_TIMEOUT_MS: 900000
      BROWSER_WORKER_MIN_AVAILABLE_MEMORY_BYTES: 1073741824
      BROWSER_WORKER_MIN_CGROUP_HEADROOM_BYTES: 268435456
      BROWSER_WORKER_PROFILE_ROOT: /tmp/athena-browser-worker
      STORAGE_DIR: /tmp/athena-browser-worker
    networks:
      - anything-llm

  anything-llm-browser-egress:
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      target: browser-egress-build
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    profiles:
      - browser-runtimes
    tmpfs:
      - /tmp/athena-browser-egress:rw,nosuid,nodev,noexec,size=64m,mode=0700,uid=1000,gid=1000
    volumes:
      - *runtime-env-volume-ro
      - "${ATHENA_PASSWORD_PEPPER_HOST_FILE:?required}:/run/secrets/athena_password_pepper:ro"
      - "${ATHENA_MTLS_HOST_DIR:?required}:/run/secrets/athena-mtls:ro"
    user: "${UID:-1000}:${GID:-1000}"
