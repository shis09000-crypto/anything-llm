global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yaml
  - /etc/prometheus/slo-recording-rules.yaml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: athena-api
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:3001]
  - job_name: athena-realtime-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:3013]
