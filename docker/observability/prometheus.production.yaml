global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yaml
  - /etc/prometheus/slo-recording-rules.yaml

scrape_configs:
  - job_name: athena-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/athena_metrics_token
    static_configs:
      - targets: [anything-llm:3001]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
