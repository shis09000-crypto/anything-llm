global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yaml
  - /etc/prometheus/slo-recording-rules.yaml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
        labels: { module_id: observability-infra }

  - job_name: athena-api
    scheme: https
    metrics_path: /metrics
    authorization:
      { type: Bearer, credentials_file: /run/secrets/athena_metrics_token }
    tls_config: &athena_api_tls
      ca_file: /run/secrets/athena-mtls/ca.pem
      cert_file: /run/secrets/athena-mtls/prometheus.pem
      key_file: /run/secrets/athena-mtls/prometheus.key
      server_name: anything-llm-api
      min_version: TLS13
    static_configs:
      - targets: [anything-llm-api:3024]
        labels: { module_id: athena-api }

  - job_name: athena-edge-web
    scheme: https
    metrics_path: /metrics
    authorization:
      { type: Bearer, credentials_file: /run/secrets/athena_metrics_token }
    tls_config:
      <<: *athena_api_tls
      server_name: anything-llm-edge-probe
    static_configs:
      - targets: [anything-llm-edge-probe:3025]
        labels: { module_id: edge-web }

  - job_name: athena-background-worker
    scheme: https
    metrics_path: /metrics
    authorization:
      { type: Bearer, credentials_file: /run/secrets/athena_metrics_token }
