events {}

http {
  map $ssl_client_s_dn $athena_edge_client_allowed {
    default 0;
    ~CN=edge-web 1;
  }

  server {
    listen 3443 ssl;
    server_name anything-llm-api-tls;

    ssl_protocols TLSv1.3;
    ssl_certificate /run/secrets/athena-mtls/api.pem;
    ssl_certificate_key /run/secrets/athena-mtls/api.key;
    ssl_client_certificate /run/secrets/athena-mtls/ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;
    if ($athena_edge_client_allowed = 0) { return 403; }

    location / {
      proxy_pass http://anything-llm-api:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
