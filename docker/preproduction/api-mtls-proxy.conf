events {}

http {
  # Docker service addresses change when a module is independently recreated.
  # Resolve the API service at request time so this mTLS boundary does not pin
  # the address that existed when nginx started.
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 2s;

  upstream athena_api_pool {
    zone athena_api_pool 64k;
    least_conn;
    server anything-llm-api:3001 resolve max_fails=1 fail_timeout=2s;
    server anything-llm-api-green:3001 resolve max_fails=1 fail_timeout=2s;
    keepalive 32;
  }

  map $ssl_client_s_dn $athena_edge_client_allowed {
    default 0;
    ~CN=edge-web 1;
  }

  server {
    listen 3443 ssl;
    server_name anything-llm-api-tls;

    ssl_protocols TLSv1.3;
    ssl_certificate /run/secrets/athena-mtls/api.pem;
    ssl_certificate_key /run/secrets/athena-mtls/api.key;
    ssl_client_certificate /run/secrets/athena-mtls/ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;
    if ($athena_edge_client_allowed = 0) { return 403; }

    location / {
      proxy_pass http://athena_api_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;
      proxy_buffering off;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
