  anything-llm-browser-worker:
    profiles: ["browser-runtimes"]
    depends_on:
      minio-init: { condition: service_completed_successfully }
    init: true
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
      - seccomp=./playwright-seccomp-profile.json
    shm_size: "256m"
    tmpfs:
      - /tmp/athena-browser-worker:rw,nosuid,nodev,noexec,size=512m,mode=0700,uid=1000,gid=1000
    volumes:
      - ./preproduction.empty.env:/app/server/.env:ro
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/service-mtls:/run/secrets/athena-mtls:ro
      - *metrics-token-volume
    environment:
      <<: *authoritative-runtime
      ATHENA_RUNTIME_ROLE: browser-worker
      ATHENA_SERVICE_ID: spiffe://athena/preproduction/browser-worker
      ATHENA_MTLS_CERT_FILE: /run/secrets/athena-mtls/browser-worker.pem
      ATHENA_MTLS_KEY_FILE: /run/secrets/athena-mtls/browser-worker.key
      BROWSER_WORKER_PORT: "3031"
      BROWSER_WORKER_MAX_SESSIONS: "1"
      BROWSER_WORKER_MAX_TABS: "8"
      BROWSER_WORKER_IDLE_TIMEOUT_MS: "900000"
      BROWSER_WORKER_MIN_AVAILABLE_MEMORY_BYTES: "1073741824"
      BROWSER_WORKER_MIN_CGROUP_HEADROOM_BYTES: "268435456"
      BROWSER_WORKER_PROFILE_ROOT: /tmp/athena-browser-worker
      STORAGE_DIR: /tmp/athena-browser-worker
    networks: [anything-llm]

