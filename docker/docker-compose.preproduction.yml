  anything-llm-collector:
    depends_on:
      minio-init: { condition: service_completed_successfully }
    volumes:
      - preprod-storage:/app/server/storage:ro
      - preprod-collector-hotdir:/app/collector/hotdir:ro
      # Collector is the only persistent writer for parsed outputs. All
      # consumers receive this transport read-only during the S3 transition.
      - preprod-collector-outputs:/app/collector/outputs
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/service-mtls:/run/secrets/athena-mtls:ro
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/runtime-secrets/metrics-token:/run/secrets/athena_metrics_token:ro
    environment:
      APP_ENV: preproduction
      NODE_ENV: production
      ATHENA_RUNTIME_ROLE: collector
      ATHENA_SERVICE_ID: spiffe://athena/preproduction/collector
      ATHENA_SERVICE_MTLS_REQUIRED: "true"
      COLLECTOR_MTLS_CA_FILE: /run/secrets/athena-mtls/ca.pem
      COLLECTOR_MTLS_CERT_FILE: /run/secrets/athena-mtls/collector.pem
      COLLECTOR_MTLS_KEY_FILE: /run/secrets/athena-mtls/collector.key
      COLLECTOR_MTLS_ALLOWED_CLIENT_IDS: spiffe://athena/preproduction/api,spiffe://athena/preproduction/background-worker,spiffe://athena/preproduction/knowledge-ingest,spiffe://athena/preproduction/operations-plane,spiffe://athena/preproduction/prometheus,spiffe://athena/preproduction/collector
      ATHENA_METRICS_TOKEN_FILE: /run/secrets/athena_metrics_token
      ATHENA_COLLECTOR_GUARD_V2: "true"
      COLLECTOR_PORT: "8888"
      COLLECTOR_BIND_HOST: 0.0.0.0
    networks: [anything-llm]
