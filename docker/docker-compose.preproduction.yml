name: athena-preproduction

x-authoritative-runtime: &authoritative-runtime
  APP_ENV: preproduction
  ATHENA_RUNTIME_TOPOLOGY: distributed
  ATHENA_DATABASE_PROVIDER: postgresql
  ATHENA_POSTGRES_MAIN_URL: postgresql://athena_main_api:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main
  ATHENA_POSTGRES_AUTH_URL: postgresql://athena_auth_api:${ATHENA_PREPROD_POSTGRES_AUTH_PASSWORD:?required}@postgresql:5432/athena_auth
  ATHENA_POSTGRES_MAIN_MIGRATION_URL: postgresql://athena_main_migrator:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main
  ATHENA_POSTGRES_AUTH_MIGRATION_URL: postgresql://athena_auth_migrator:${ATHENA_PREPROD_POSTGRES_AUTH_PASSWORD:?required}@postgresql:5432/athena_auth
  # Module principals query the compatible public Prisma schema, but table
  # ACLs grant writes only to the owner declared by ModuleManifest. The other
  # database is always reached through a read-only observer principal.
  ATHENA_WORKSPACE_DATABASE_URL: postgresql://athena_workspace:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_CHAT_DATABASE_URL: postgresql://athena_chat:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_AGENT_DATABASE_URL: postgresql://athena_agent:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_MODEL_DATABASE_URL: postgresql://athena_model_runtime:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_RESPONSES_DATABASE_URL: postgresql://athena_responses_runtime:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=responses_runtime
  ATHENA_TOOL_DATABASE_URL: postgresql://athena_tools:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_CRYPTO_MARKET_DATABASE_URL: postgresql://athena_crypto_market:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_CRYPTO_ACCOUNT_DATABASE_URL: postgresql://athena_crypto_account:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_CRYPTO_FORECAST_DATABASE_URL: postgresql://athena_crypto_forecast:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_BROWSER_DATABASE_URL: postgresql://athena_browser_plane:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_BROWSER_EGRESS_DATABASE_URL: postgresql://athena_browser_egress:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_RAG_DATABASE_URL: postgresql://athena_knowledge_query:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_INGEST_DATABASE_URL: postgresql://athena_knowledge_ingest:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_READER_DATABASE_URL: postgresql://athena_knowledge_reader:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_BACKGROUND_DATABASE_URL: postgresql://athena_maintenance:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_MAINTENANCE_DATABASE_URL: postgresql://athena_maintenance:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_SCHEDULER_DATABASE_URL: postgresql://athena_scheduler:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_COORDINATION_DATABASE_URL: postgresql://athena_coordination:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_SYNC_DATABASE_URL: postgresql://athena_sync:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_MAIN_OBSERVER_DATABASE_URL: postgresql://athena_main_observer:${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_IDENTITY_MAIN_DATABASE_URL: postgresql://athena_identity:${ATHENA_PREPROD_POSTGRES_AUTH_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_KEY_CUSTODY_MAIN_DATABASE_URL: postgresql://athena_key_custody:${ATHENA_PREPROD_POSTGRES_AUTH_PASSWORD:?required}@postgresql:5432/athena_main?schema=public
  ATHENA_IDENTITY_DATABASE_URL: postgresql://athena_identity:${ATHENA_PREPROD_POSTGRES_AUTH_PASSWORD:?required}@postgresql:5432/athena_auth?schema=public
  ATHENA_KEY_CUSTODY_DATABASE_URL: postgresql://athena_key_custody:${ATHENA_PREPROD_POSTGRES_AUTH_PASSWORD:?required}@postgresql:5432/athena_auth?schema=public
  ATHENA_AUTH_OBSERVER_DATABASE_URL: postgresql://athena_auth_observer:${ATHENA_PREPROD_POSTGRES_AUTH_PASSWORD:?required}@postgresql:5432/athena_auth?schema=public
  ATHENA_MODULE_SCHEMA_CUTOVER: "true"
  # Persistent application data is authoritative in PostgreSQL/S3. Runtime
  # roles receive the legacy volume only as a read-only compatibility view;
  # no two modules may share a writable filesystem transport.
  ATHENA_SHARED_STORAGE_CUTOVER: "true"
  ATHENA_SQLITE_RUNTIME_FALLBACK: "false"
  ATHENA_BROADCAST_TRANSPORT: nats
  ATHENA_MEMORY_TRANSPORT_FALLBACK: "false"
  ATHENA_NATS_SERVERS: tls://nats:4222
  ATHENA_NATS_TLS_CA_FILE: /run/secrets/athena-mtls/ca.pem
  ATHENA_NATS_TLS_SERVER_NAME: nats
  ATHENA_NATS_SUBJECT_KEY_FILE: /run/secrets/athena_nats_subject_key
  ATHENA_CONTENT_STORE: s3
  ATHENA_S3_BUCKET: athena-preproduction
  ATHENA_S3_PREFIX: athena/content-objects
  ATHENA_S3_ENDPOINT: https://minio:9000
  ATHENA_S3_REGION: us-east-1
  ATHENA_S3_FORCE_PATH_STYLE: "true"
  AWS_ACCESS_KEY_ID: ${ATHENA_PREPROD_S3_ACCESS_KEY:?required}
  AWS_SECRET_ACCESS_KEY: ${ATHENA_PREPROD_S3_SECRET_KEY:?required}
  NODE_EXTRA_CA_CERTS: /run/secrets/athena-mtls/ca.pem
  ATHENA_SERVICE_MTLS_REQUIRED: "true"
  ATHENA_MTLS_CA_FILE: /run/secrets/athena-mtls/ca.pem
  ATHENA_READER_WORKER_QUEUE: "true"
  ATHENA_READER_WORKER_FALLBACK_IN_PROCESS: "false"
  ATHENA_STRICT_READY: "true"
  ATHENA_REQUIRE_NODE24_PQ_PROBE: "true"
  ATHENA_PQ_RUNTIME_EXPECTED_CAPABILITIES: ml_kem_768,ml_dsa_65,encapsulation_api,classical_provider_baseline
  ATHENA_KEY_CUSTODY_CUTOVER: "true"
  ATHENA_KEY_CUSTODY_URL: https://anything-llm-key-custody:3023
  ATHENA_OPERATIONS_ENABLED: "true"
  ATHENA_OPERATIONS_PLANE_INLINE: "false"
  ATHENA_OPERATIONS_INTERNAL_URL: https://anything-llm-operations-plane:3015
  ATHENA_OPERATIONS_SHADOW_AGENTS_INLINE: "false"
  ATHENA_OPERATIONS_SHADOW_AGENTS_URL: https://anything-llm-operations-shadow-agents:3029
  ATHENA_IDENTITY_URL: https://anything-llm-identity:3026
  ATHENA_KNOWLEDGE_INGEST_URL: https://anything-llm-knowledge-ingest:3027
  ATHENA_RAG_CUTOVER: "true"
  ATHENA_RAG_URL: https://anything-llm-rag:3028
  ATHENA_BROWSER_PLANE_URL: https://anything-llm-browser-plane:3030
  ATHENA_BROWSER_WORKER_URL: https://anything-llm-browser-worker:3031
  ATHENA_BROWSER_EGRESS_URL: https://anything-llm-browser-egress:3033
  ATHENA_COORDINATION_INTERNAL_URL: https://anything-llm-coordination-plane:3032
  ATHENA_BROWSER_AGENT_ENABLED: "false"
  ATHENA_OPERATIONS_HEARTBEAT_ENABLED: "true"
  ATHENA_OPERATIONS_HEARTBEAT_MS: "60000"
  ATHENA_OPERATIONS_PRODUCER_STALE_MS: "180000"
  ATHENA_OPERATIONS_MODULE_POLL_MS: "15000"
  ATHENA_OPERATIONS_MODULE_TIMEOUT_MS: "5000"
  ATHENA_METRICS_TOKEN_FILE: /run/secrets/athena_metrics_token
  ATHENA_PLUGIN_CAPABILITY_HYBRID_REQUIRED: "true"
  ATHENA_PLUGIN_CAPABILITY_ED25519_KEY_ID: preproduction-ed25519
  ATHENA_PLUGIN_CAPABILITY_ED25519_PRIVATE_KEY_FILE: /run/secrets/athena-capability/ed25519-private.pem
  ATHENA_PLUGIN_CAPABILITY_ED25519_PUBLIC_KEY_FILE: /run/secrets/athena-capability/ed25519-public.pem
  ATHENA_PLUGIN_CAPABILITY_MLDSA65_KEY_ID: preproduction-mldsa65
  ATHENA_PLUGIN_CAPABILITY_MLDSA65_PRIVATE_KEY_FILE: /run/secrets/athena-capability/mldsa65-private.pem
  ATHENA_PLUGIN_CAPABILITY_MLDSA65_PUBLIC_KEY_FILE: /run/secrets/athena-capability/mldsa65-public.pem
  AUTH_TOKEN: ${ATHENA_PREPROD_AUTH_TOKEN:?required}
  JWT_SECRET: ${ATHENA_PREPROD_JWT_SECRET:?required}
  SIG_KEY: ${ATHENA_PREPROD_SIG_KEY:?required}
  SIG_SALT: ${ATHENA_PREPROD_SIG_SALT:?required}
  ATHENA_SESSION_V2: "true"
  ATHENA_SESSION_V2_REQUIRE_MULTI: "true"
  ATHENA_REALTIME_REQUIRE_SESSION: "true"
  ATHENA_REALTIME_TICKET_STORE: database
  PUBLIC_APP_URL: ${ATHENA_PREPROD_PUBLIC_URL:-https://preproduction.athena.invalid}
  ATHENA_ALLOWED_ORIGINS: ${ATHENA_PREPROD_PUBLIC_URL:-https://preproduction.athena.invalid}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  # The production collector does not enable the optional health_check
  # extension. Its Prometheus exporter is the authoritative liveness surface.
  ATHENA_OTEL_HEALTH_URL: http://otel-collector:9464/metrics
  ATHENA_MODEL_GATEWAY_URL: https://anything-llm-model-gateway:3018

x-nats-secrets-volume: &nats-secrets-volume ${ATHENA_PREPROD_SECRETS_DIR:?required}/nats:/run/secrets/athena-nats:ro
x-nats-subject-volume: &nats-subject-volume ${ATHENA_PREPROD_SECRETS_DIR:?required}/runtime-secrets/nats-subject-key:/run/secrets/athena_nats_subject_key:ro
x-metrics-token-volume: &metrics-token-volume ${ATHENA_PREPROD_SECRETS_DIR:?required}/runtime-secrets/metrics-token:/run/secrets/athena_metrics_token:ro

networks:
  anything-llm:
    name: athena-preproduction
    driver: bridge

volumes:
  preprod-postgresql:
  preprod-nats:
  preprod-minio:
  preprod-clickhouse:
  preprod-prometheus:
  preprod-grafana:
  preprod-caddy-data:
  preprod-caddy-config:
  preprod-tempo:
  preprod-loki:
  preprod-storage:
  preprod-collector-hotdir:
  preprod-collector-outputs:
  preprod-evidence:
  preprod-evidence-green:

services:
  postgresql:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: athena_platform_admin
      POSTGRES_PASSWORD: ${ATHENA_PREPROD_POSTGRES_ADMIN_PASSWORD:?required}
      POSTGRES_DB: postgres
      ATHENA_POSTGRES_MAIN_PASSWORD: ${ATHENA_PREPROD_POSTGRES_MAIN_PASSWORD:?required}
      ATHENA_POSTGRES_AUTH_PASSWORD: ${ATHENA_PREPROD_POSTGRES_AUTH_PASSWORD:?required}
    command:
      - postgres
      - -c
      - max_connections=180
      - -c
      - shared_buffers=384MB
      - -c
      - log_min_duration_statement=500
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - preprod-postgresql:/var/lib/postgresql/data
      - ./postgresql/init-athena.sh:/docker-entrypoint-initdb.d/10-athena.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena_platform_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [anything-llm]

  nats:
    image: nats:2.10.27-alpine
    restart: unless-stopped
    command: ["-c", "/run/secrets/athena-nats/nats-server.conf"]
    volumes:
      - preprod-nats:/data
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/nats:/run/secrets/athena-nats:ro
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/service-mtls:/run/secrets/athena-mtls:ro
    ports:
      - "127.0.0.1:54222:4222"
      - "127.0.0.1:58222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [anything-llm]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001 --certs-dir /certs
    environment:
      MINIO_ROOT_USER: ${ATHENA_PREPROD_MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${ATHENA_PREPROD_MINIO_ROOT_PASSWORD:?required}
    volumes:
      - preprod-minio:/data
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/service-mtls/minio.pem:/certs/public.crt:ro
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/service-mtls/minio.key:/certs/private.key:ro
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/service-mtls/ca.pem:/certs/CAs/ca.pem:ro
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "--fail",
          "--insecure",
          "https://127.0.0.1:9000/minio/health/ready",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [anything-llm]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local https://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" --insecure;
        mc admin user add local "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY" --insecure || true;
        mc admin policy attach local readwrite --user "$$AWS_ACCESS_KEY_ID" --insecure;
        mc mb --with-lock --ignore-existing local/athena-preproduction --insecure;
    environment:
      MINIO_ROOT_USER: ${ATHENA_PREPROD_MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${ATHENA_PREPROD_MINIO_ROOT_PASSWORD:?required}
      AWS_ACCESS_KEY_ID: ${ATHENA_PREPROD_S3_ACCESS_KEY:?required}
      AWS_SECRET_ACCESS_KEY: ${ATHENA_PREPROD_S3_SECRET_KEY:?required}
    networks: [anything-llm]

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: athena_operations
      CLICKHOUSE_USER: athena_ops
      CLICKHOUSE_PASSWORD: ${ATHENA_PREPROD_CLICKHOUSE_PASSWORD:?required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - preprod-clickhouse:/var/lib/clickhouse
      - ./clickhouse/config.d/low-resource.xml:/etc/clickhouse-server/config.d/low-resource.xml:ro
      - ./clickhouse/init/10-operations.sql:/docker-entrypoint-initdb.d/10-operations.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O - 'http://127.0.0.1:8123/ping' | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [anything-llm]

  tempo:
    image: grafana/tempo:2.8.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - preprod-tempo:/var/tempo
    networks: [anything-llm]

  loki:
    image: grafana/loki:3.5.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml:ro
      - preprod-loki:/loki
    networks: [anything-llm]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on: [tempo, loki]
    networks: [anything-llm]

  prometheus:
    image: prom/prometheus:v3.4.2
    container_name: anything-llm-prometheus
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.preproduction.yaml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yaml:/etc/prometheus/alert-rules.yaml:ro
      - ./observability/slo-recording-rules.yaml:/etc/prometheus/slo-recording-rules.yaml:ro
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/service-mtls:/run/secrets/athena-mtls:ro
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/runtime-secrets/metrics-token:/run/secrets/athena_metrics_token:ro
      - preprod-prometheus:/prometheus
    ports:
      - "127.0.0.1:59090:9090"
    depends_on:
      prometheus-init: { condition: service_completed_successfully }
    networks: [anything-llm]

  prometheus-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - chown -R "${UID:-1000}:${GID:-1000}" /prometheus
    volumes:
      - preprod-prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: athena_admin
      GF_SECURITY_ADMIN_PASSWORD: ${ATHENA_PREPROD_GRAFANA_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/athena.yaml:ro
      - preprod-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:53000:3000"
    depends_on: [prometheus, tempo, loki]
    networks: [anything-llm]

  anything-llm-api:
    depends_on:
      postgresql: { condition: service_healthy }
      nats: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      anything-llm-key-custody: { condition: service_healthy }
    volumes:
      - ./preproduction.empty.env:/app/server/.env:ro
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/runtime-secrets/password-pepper:/run/secrets/athena_password_pepper:ro
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/service-mtls:/run/secrets/athena-mtls:ro
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/plugin-capability:/run/secrets/athena-capability:ro
      - preprod-storage:/app/server/storage:ro
      - preprod-collector-hotdir:/app/collector/hotdir:ro
      - preprod-collector-outputs:/app/collector/outputs:ro
      - preprod-evidence:/app/server/evidence
      - *nats-secrets-volume
      - *nats-subject-volume
      - *metrics-token-volume
    environment:
      <<: *authoritative-runtime
      ATHENA_RUNTIME_ROLE: api
      ATHENA_SERVICE_ID: spiffe://athena/preproduction/api
      ATHENA_MTLS_CERT_FILE: /run/secrets/athena-mtls/api.pem
      ATHENA_MTLS_KEY_FILE: /run/secrets/athena-mtls/api.key
      ATHENA_NATS_NKEY_SEED_FILE: /run/secrets/athena-nats/api.nk
      ATHENA_NATS_CONSUMER_NAME: preproduction-api
      ATHENA_API_INTERNAL_PORT: "3024"
      ATHENA_AUTHENTICATION_INLINE: "false"
      ATHENA_KNOWLEDGE_INGEST_INLINE: "false"
      ATHENA_RAG_INLINE: "false"
      COLLECTOR_ENDPOINT: https://anything-llm-collector:8888
      ATHENA_CHAT_UPSTREAM: https://anything-llm-chat-runtime:3016
      ATHENA_AGENT_UPSTREAM: https://anything-llm-agent-runtime:3017
      ATHENA_TOOL_UPSTREAM: https://anything-llm-tool-broker:3019
      ATHENA_CRYPTO_ACCOUNT_UPSTREAM: https://anything-llm-crypto-account:3021
      ATHENA_CRYPTO_FORECAST_UPSTREAM: https://anything-llm-crypto-forecast:3022
      ATHENA_REALTIME_UPSTREAM: https://anything-llm-realtime-gateway:3013
    networks: [anything-llm]

  anything-llm-api-green:
    extends:
      service: anything-llm-api
    environment:
      ATHENA_API_INSTANCE_SLOT: green
      ATHENA_NATS_CONSUMER_NAME: preproduction-api-green
    volumes:
      - preprod-evidence-green:/app/server/evidence

  anything-llm-api-tls:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./preproduction/api-mtls-proxy.conf:/etc/nginx/nginx.conf:ro
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/service-mtls:/run/secrets/athena-mtls:ro
    networks: [anything-llm]

  anything-llm-web:
    volumes:
      - ./preproduction/edge-proxy-ssl.conf:/etc/nginx/conf.d/athena-proxy-ssl.conf:ro
      - ${ATHENA_PREPROD_SECRETS_DIR:?required}/service-mtls:/run/secrets/athena-mtls:ro
    environment:
      ATHENA_WEB_PORT: 3000
      ATHENA_API_UPSTREAM: https://anything-llm-api-tls:3443
      ATHENA_REALTIME_UPSTREAM: https://anything-llm-realtime-gateway:3013
