name: Windows Desktop Installer Smoke

concurrency:
  group: windows-desktop-installer-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/windows-desktop-installer-smoke.yaml"
      - "desktop/**"
      - "server/**"
      - "collector/**"
      - "frontend/**"
      - "package.json"

jobs:
  windows-installer-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Install server dependencies
        shell: pwsh
        run: |
          cd server
          yarn install --frozen-lockfile

      - name: Install collector dependencies
        shell: pwsh
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
          SHARP_IGNORE_GLOBAL_LIBVIPS: "true"
        run: |
          cd collector
          yarn install --frozen-lockfile

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          cd desktop
          npm ci

      - name: Audit desktop isolation and process supervision
        shell: pwsh
        run: |
          cd desktop
          npm test
          npm run security:audit

      - name: Build Windows installer
        shell: pwsh
        run: |
          yarn desktop:dist:win

      - name: Smoke test silent install and desktop shortcut
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-desktop -Filter "*.exe" | Where-Object { $_.Name -like "*Setup*" } | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced."
          }
          ./desktop/scripts/windows-installer-smoke.ps1 -InstallerPath $installer.FullName

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vector-knowledge-windows-installer
          path: |
            dist-desktop/*.exe
            dist-desktop/*.blockmap
