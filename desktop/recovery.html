<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"
    />
    <title>向量知识库启动恢复</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: #f8fafc;
        background:
          radial-gradient(circle at 15% 10%, rgba(14, 165, 233, 0.22), transparent 34%),
          radial-gradient(circle at 85% 20%, rgba(34, 197, 94, 0.16), transparent 30%),
          linear-gradient(135deg, #0f172a, #111827 54%, #0b1120);
        display: grid;
        place-items: center;
      }
      main {
        width: min(920px, calc(100vw - 48px));
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.72);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(24px);
        padding: 34px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.7;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin: 26px 0;
      }
      .item {
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.06);
      }
      .label {
        color: #94a3b8;
        font-size: 12px;
        margin-bottom: 8px;
      }
      .value {
        font-size: 14px;
        word-break: break-all;
      }
      pre {
        max-height: 240px;
        overflow: auto;
        padding: 14px;
        border-radius: 12px;
        color: #d1d5db;
        background: rgba(2, 6, 23, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.1);
        white-space: pre-wrap;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 18px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 18px;
        color: white;
        font-weight: 700;
        background: #0ea5e9;
        cursor: pointer;
      }
      button.secondary {
        background: rgba(255, 255, 255, 0.12);
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>本地服务启动失败</h1>
      <p>向量知识库没有白屏，只是本地 server 或 collector 没有成功启动。你可以重试启动，或重新选择数据目录。</p>
      <div class="grid">
        <div class="item">
          <div class="label">Server 端口</div>
          <div class="value" id="serverPort">-</div>
        </div>
        <div class="item">
          <div class="label">Collector 端口</div>
          <div class="value" id="collectorPort">-</div>
        </div>
        <div class="item">
          <div class="label">数据目录</div>
          <div class="value" id="storageDir">-</div>
        </div>
        <div class="item">
          <div class="label">错误原因</div>
          <div class="value" id="error">-</div>
        </div>
      </div>
      <pre id="logs"></pre>
      <div class="actions">
        <button id="retry">重试启动</button>
        <button class="secondary" id="choose">重新选择数据目录</button>
      </div>
    </main>
    <script>
      const state = { payload: null };
      function render(payload) {
        state.payload = payload;
        document.getElementById("serverPort").textContent =
          payload?.runtime?.serverPort || "-";
        document.getElementById("collectorPort").textContent =
          payload?.runtime?.collectorPort || "-";
        document.getElementById("storageDir").textContent =
          payload?.runtime?.storageDir || "-";
        document.getElementById("error").textContent = payload?.error || "-";
        document.getElementById("logs").textContent = [
          "[desktop]",
          payload?.logs?.desktop || "",
          "[server]",
          payload?.logs?.server || "",
          "[collector]",
          payload?.logs?.collector || "",
        ].join("\n");
      }
      window.desktopRuntime.onStartupError(render);
      window.desktopRuntime.getStartupError().then(render);
      document.getElementById("retry").addEventListener("click", async (event) => {
        event.target.disabled = true;
        event.target.textContent = "正在重试...";
        try {
          await window.desktopRuntime.retryStart();
        } catch (error) {
          render({ ...state.payload, error: error.message });
          event.target.disabled = false;
          event.target.textContent = "重试启动";
        }
      });
      document.getElementById("choose").addEventListener("click", async () => {
        const result = await window.desktopRuntime.chooseStorageDir();
        if (result?.runtime) render({ ...state.payload, runtime: result.runtime });
      });
    </script>
  </body>
</html>
